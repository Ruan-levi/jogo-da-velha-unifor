<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha - UNIFOR</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --azul-unifor: #003366;
            --azul-destaque: #0056b3;
            --laranja-unifor: #d97706;
            --fundo-claro: #f4f6f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--fundo-claro) 0%, #e2e8f0 100%);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            background: white;
            padding: 20px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-bottom: 4px solid var(--laranja-unifor);
        }

        #ui-01-subtitle {
            color: var(--azul-destaque);
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 3px;
            margin: 0;
        }

        #ui-02-title {
            color: var(--azul-unifor);
            font-size: 2.2rem;
            margin: 5px 0 0 0;
            font-weight: 900;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        select {
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid var(--azul-unifor);
            border-radius: 8px;
            background-color: white;
            color: var(--azul-unifor);
            cursor: pointer;
            outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }

        select:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
            opacity: 0.7;
        }

        select:hover:not(:disabled) {
            border-color: var(--azul-destaque);
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            max-width: 450px;
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            border-top: 4px solid var(--azul-unifor);
        }

        .player-score {
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
        }

        .player-x { color: var(--azul-unifor); }
        .player-o { color: var(--laranja-unifor); }

        .score-value {
            font-size: 2rem;
            font-weight: 900;
            margin-top: 5px;
        }

        .round-info {
            text-align: center;
            font-weight: 800;
            color: #666;
            font-size: 0.9rem;
            background: var(--fundo-claro);
            padding: 10px 20px;
            border-radius: 8px;
        }

        #ui-06-round {
            font-size: 1.2rem;
            color: var(--azul-unifor);
            display: block;
            margin-top: 3px;
        }

        #ui-08-status {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 20px;
            height: 30px;
            color: var(--azul-unifor);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .board-container {
            position: relative;
            width: 340px;
            height: 340px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            height: 100%;
            background-color: var(--azul-unifor);
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,51,102,0.2);
            box-sizing: border-box;
        }

        .cell {
            background-color: white;
            border: none;
            border-radius: 6px;
            font-size: 4.5rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease-in-out;
            padding: 0;
            margin: 0;
        }

        .cell:hover:not(:disabled) {
            background-color: #f0f4f8;
            transform: scale(0.98);
        }

        #ui-10-win-line {
            position: absolute;
            background-color: #28a745;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform-origin: center;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(40,167,69,0.6);
        }

        .btn-action {
            margin-top: 25px;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 800;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            letter-spacing: 1px;
        }

        #ui-11-btn-reset {
            background-color: var(--azul-unifor);
        }

        #ui-11-btn-reset:hover {
            background-color: var(--azul-destaque);
            transform: translateY(-2px);
        }

        #ui-12-btn-next {
            background-color: var(--laranja-unifor);
            display: none;
        }

        #ui-12-btn-next:hover {
            background-color: #b56305;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header>
        <p id="ui-01-subtitle">UNIVERSIDADE DE FORTALEZA</p>
        <h1 id="ui-02-title">JOGO DA VELHA</h1>
    </header>

    <div class="controls">
        <select id="ui-03-mode">
            <option value="pvp">2 Jogadores (PVP)</option>
            <option value="cpu">Contra o Computador</option>
        </select>
        <select id="ui-04-format">
            <option value="single">Partida Única</option>
            <option value="bo3">Melhor de 3 (MD3)</option>
        </select>
        <select id="ui-09-first-player">
            <option value="X">Começa: Jogador X</option>
            <option value="O">Começa: Jogador O</option>
        </select>
    </div>

    <div class="scoreboard">
        <div class="player-score player-x">
            JOGADOR X
            <span id="ui-05-score-x" class="score-value">0</span>
        </div>
        <div class="round-info">
            RODADA
            <span id="ui-06-round">1/1</span>
        </div>
        <div class="player-score player-o">
            <span id="label-player-o">JOGADOR O</span>
            <span id="ui-07-score-o" class="score-value">0</span>
        </div>
    </div>

    <div id="ui-08-status">Vez do Jogador X</div>

    <div class="board-container">
        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>
        <div id="ui-10-win-line"></div>
    </div>

    <button id="ui-11-btn-reset" class="btn-action">REINICIAR JOGO</button>
    <button id="ui-12-btn-next" class="btn-action">PRÓXIMA RODADA ➔</button>

    <script>
        let options = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let startingPlayer = 'X';
        let matchStartingPlayer = 'X';
        let running = false;
        let winsX = 0;
        let winsO = 0;
        let currentRound = 1;
        
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('ui-08-status');
        const btnReset = document.getElementById('ui-11-btn-reset');
        const btnNext = document.getElementById('ui-12-btn-next');
        const modeSelect = document.getElementById('ui-03-mode');
        const formatSelect = document.getElementById('ui-04-format');
        const firstPlayerSelect = document.getElementById('ui-09-first-player');
        const scoreXText = document.getElementById('ui-05-score-x');
        const scoreOText = document.getElementById('ui-07-score-o');
        const roundText = document.getElementById('ui-06-round');
        const labelPlayerO = document.getElementById('label-player-o');
        const winLine = document.getElementById('ui-10-win-line');

        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'X') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'O') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'win') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.1);
                osc.frequency.setValueAtTime(659.25, now + 0.2);
                osc.frequency.setValueAtTime(880, now + 0.3);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'draw') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        function initializeGame() {
            cells.forEach(cell => cell.addEventListener('click', cellClicked));
            btnReset.addEventListener('click', fullReset);
            btnNext.addEventListener('click', startNextRound);
            modeSelect.addEventListener('change', handleConfigChange);
            formatSelect.addEventListener('change', handleConfigChange);
            firstPlayerSelect.addEventListener('change', handleConfigChange);
            fullReset();
        }

        function setSelectsDisabled(disabled) {
            modeSelect.disabled = disabled;
            formatSelect.disabled = disabled;
            firstPlayerSelect.disabled = disabled;
        }

        function cellClicked(e) {
            const cellIndex = e.target.getAttribute('data-index');
            if (options[cellIndex] !== '' || !running) return;
            
            setSelectsDisabled(true);
            updateCell(e.target, cellIndex);
            checkWinner();

            if (running && modeSelect.value === 'cpu' && currentPlayer === 'O') {
                running = false;
                statusText.textContent = "COMPUTADOR PENSANDO...";
                setTimeout(cpuMove, 500);
            }
        }

        function updateCell(cell, index) {
            options[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.style.color = currentPlayer === 'X' ? 'var(--azul-unifor)' : 'var(--laranja-unifor)';
            playSound(currentPlayer);
        }

        function changePlayer() {
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            let nomeO = modeSelect.value === 'cpu' ? "Computador" : "Jogador O";
            let nomeAtual = currentPlayer === 'X' ? "Jogador X" : nomeO;
            statusText.textContent = `VEZ DO ${nomeAtual}`;
        }

        function cpuMove() {
            let availableCells = [];
            options.forEach((val, idx) => { if (val === '') availableCells.push(idx); });

            if (availableCells.length > 0) {
                const randomIdx = Math.floor(Math.random() * availableCells.length);
                const cellIndex = availableCells[randomIdx];
                const cellElement = document.querySelector(`.cell[data-index="${cellIndex}"]`);
                
                updateCell(cellElement, cellIndex);
                running = true;
                checkWinner();
            }
        }

        function checkWinner() {
            let roundWon = false;
            let winningCondition = [];

            for (let i = 0; i < winPatterns.length; i++) {
                const condition = winPatterns[i];
                const [a, b, c] = condition;
                if (options[a] && options[a] === options[b] && options[a] === options[c]) {
                    roundWon = true;
                    winningCondition = condition;
                    break;
                }
            }

            if (roundWon) {
                handleWin(winningCondition);
            } else if (!options.includes('')) {
                handleDraw();
            } else {
                changePlayer();
            }
        }

        function drawWinLine(condition) {
            const [a, b, c] = condition;
            winLine.style.opacity = '1';
            winLine.style.height = '8px';
            winLine.style.width = '300px';
            
            if (a === 0 && c === 2) { winLine.style.top = '16%'; winLine.style.left = '6%'; winLine.style.transform = 'rotate(0deg)'; }
            else if (a === 3 && c === 5) { winLine.style.top = '49%'; winLine.style.left = '6%'; winLine.style.transform = 'rotate(0deg)'; }
            else if (a === 6 && c === 8) { winLine.style.top = '82%'; winLine.style.left = '6%'; winLine.style.transform = 'rotate(0deg)'; }
            else if (a === 0 && c === 6) { winLine.style.top = '49%'; winLine.style.left = '-38%'; winLine.style.transform = 'rotate(90deg)'; }
            else if (a === 1 && c === 7) { winLine.style.top = '49%'; winLine.style.left = '6%'; winLine.style.transform = 'rotate(90deg)'; }
            else if (a === 2 && c === 8) { winLine.style.top = '49%'; winLine.style.left = '49%'; winLine.style.transform = 'rotate(90deg)'; }
            else if (a === 0 && c === 8) { winLine.style.width = '420px'; winLine.style.top = '49%'; winLine.style.left = '-12%'; winLine.style.transform = 'rotate(45deg)'; }
            else if (a === 2 && c === 6) { winLine.style.width = '420px'; winLine.style.top = '49%'; winLine.style.left = '-12%'; winLine.style.transform = 'rotate(-45deg)'; }
        }

        function handleWin(condition) {
            running = false;
            drawWinLine(condition);
            playSound('win');
            confetti({ particleCount: 200, spread: 90, origin: { y: 0.6 }, colors: ['#003366', '#0056b3', '#d97706'] });

            if (currentPlayer === 'X') {
                winsX++;
                statusText.textContent = "JOGADOR X VENCEU A RODADA!";
            } else {
                winsO++;
                let nome = modeSelect.value === 'cpu' ? "COMPUTADOR" : "JOGADOR O";
                statusText.textContent = `${nome} VENCEU A RODADA!`;
            }
            
            updateScoreUI();
            checkMatchEnd();
        }

        function handleDraw() {
            running = false;
            playSound('draw');
            statusText.textContent = "RODADA EMPATADA!";
            checkMatchEnd();
        }

        function checkMatchEnd() {
            const format = formatSelect.value;
            
            if (format === 'bo3') {
                if (winsX >= 2) {
                    statusText.textContent = "🏆 JOGADOR X CAMPEÃO (MD3)!";
                } else if (winsO >= 2) {
                    let nome = modeSelect.value === 'cpu' ? "COMPUTADOR" : "JOGADOR O";
                    statusText.textContent = `🏆 ${nome} CAMPEÃO (MD3)!`;
                } else if (currentRound < 3) {
                    btnReset.style.display = 'none';
                    btnNext.style.display = 'inline-block';
                } else {
                    if (winsX > winsO) statusText.textContent = "🏆 JOGADOR X CAMPEÃO (MD3)!";
                    else if (winsO > winsX) {
                        let nome = modeSelect.value === 'cpu' ? "COMPUTADOR" : "JOGADOR O";
                        statusText.textContent = `🏆 ${nome} CAMPEÃO (MD3)!`;
                    }
                    else statusText.textContent = "PARTIDA EMPATADA!";
                }
            }
        }

        function startNextRound() {
            currentRound++;
            startingPlayer = startingPlayer === 'X' ? 'O' : 'X';
            btnNext.style.display = 'none';
            btnReset.style.display = 'inline-block';
            resetBoard();
        }

        function resetBoard() {
            options = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = startingPlayer;
            winLine.style.opacity = '0';
            cells.forEach(cell => cell.textContent = '');
            updateUI();
            running = true;

            if (modeSelect.value === 'cpu' && currentPlayer === 'O') {
                running = false;
                statusText.textContent = "COMPUTADOR PENSANDO...";
                setTimeout(cpuMove, 500);
            }
        }

        function fullReset() {
            winsX = 0;
            winsO = 0;
            currentRound = 1;
            matchStartingPlayer = firstPlayerSelect.value;
            startingPlayer = matchStartingPlayer;
            
            let nomeO = modeSelect.value === 'cpu' ? "Computador" : "Jogador O";
            firstPlayerSelect.options[1].textContent = `Começa: ${nomeO}`;

            setSelectsDisabled(false);
            btnNext.style.display = 'none';
            btnReset.style.display = 'inline-block';
            resetBoard();
        }

        function handleConfigChange() {
            labelPlayerO.textContent = modeSelect.value === 'cpu' ? "COMPUTADOR" : "JOGADOR O";
            fullReset();
        }

        function updateUI() {
            scoreXText.textContent = winsX;
            scoreOText.textContent = winsO;
            roundText.textContent = formatSelect.value === 'bo3' ? `${currentRound}/3` : `1/1`;
            let nomeO = modeSelect.value === 'cpu' ? "Computador" : "Jogador O";
            let nomeAtual = currentPlayer === 'X' ? "Jogador X" : nomeO;
            statusText.textContent = `VEZ DO ${nomeAtual}`;
        }

        function updateScoreUI() {
            scoreXText.textContent = winsX;
            scoreOText.textContent = winsO;
        }

        initializeGame();

    </script>
</body>
</html>
