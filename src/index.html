<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha - UNIFOR</title>
    <!-- Importação do Canvas Confetti via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* Variáveis de Cores UNIFOR */
        :root {
            --azul-unifor: #003366;
            --azul-destaque: #0056b3;
            --laranja-unifor: #d97706;
            --fundo-claro: #f4f6f9;
            --celula-bg: #ffffff;
            --celula-border: #cccccc;
            --texto-escuro: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--fundo-claro);
            color: var(--texto-escuro);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        #ui-01-subtitle {
            color: var(--azul-destaque);
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 0;
        }

        #ui-02-title {
            color: var(--azul-unifor);
            font-size: 2.5rem;
            margin: 5px 0 20px 0;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        select {
            padding: 10px;
            font-size: 1rem;
            border: 2px solid var(--azul-unifor);
            border-radius: 5px;
            background-color: white;
            color: var(--azul-unifor);
            cursor: pointer;
            outline: none;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            background-color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .player-score {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .player-x { color: var(--azul-unifor); }
        .player-o { color: var(--laranja-unifor); }

        .score-value {
            font-size: 1.5rem;
            display: block;
            margin-top: 5px;
        }

        .round-info {
            text-align: center;
            font-weight: bold;
            color: var(--texto-escuro);
        }

        #ui-08-status {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            height: 30px;
            color: var(--azul-unifor);
        }

        .board-container {
            position: relative;
            width: 320px;
            height: 320px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            width: 100%;
            height: 100%;
            background-color: var(--azul-unifor);
            padding: 5px;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .cell {
            background-color: var(--celula-bg);
            border: none;
            font-size: 4rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
            padding: 0;
            margin: 0;
            color: var(--texto-escuro); /* Cor padrão, será sobrescrita no JS */
        }

        .cell:hover:not(:disabled) {
            background-color: #e9ecef;
        }

        .cell:disabled {
            cursor: default;
        }

        /* Linha de Vitória */
        #ui-10-win-line {
            position: absolute;
            background-color: #28a745; /* Verde para destacar a vitória */
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            transform-origin: center;
        }

        #ui-11-btn-reset {
            margin-top: 30px;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background-color: var(--azul-unifor);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #ui-11-btn-reset:hover {
            background-color: var(--azul-destaque);
        }
    </style>
</head>
<body>

    <header>
        <p id="ui-01-subtitle">UNIVERSIDADE DE FORTALEZA</p>
        <h1 id="ui-02-title">JOGO DA VELHA</h1>
    </header>

    <div class="controls">
        <select id="ui-03-mode">
            <option value="pvp">2 Jogadores (PVP)</option>
            <option value="cpu">Contra o Computador</option>
        </select>
        <select id="ui-04-format">
            <option value="single">Partida Única</option>
            <option value="bo3">Melhor de 3 (MD3)</option>
        </select>
    </div>

    <div class="scoreboard">
        <div class="player-score player-x">
            JOGADOR X
            <span id="ui-05-score-x" class="score-value">0</span>
        </div>
        <div class="round-info">
            RODADA<br>
            <span id="ui-06-round">1/1</span>
        </div>
        <div class="player-score player-o">
            <span id="label-player-o">JOGADOR O</span>
            <span id="ui-07-score-o" class="score-value">0</span>
        </div>
    </div>

    <div id="ui-08-status">Vez do Jogador X</div>

    <div class="board-container">
        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>
        <div id="ui-10-win-line"></div>
    </div>

    <button id="ui-11-btn-reset">REINICIAR JOGO</button>

    <script>
        // --- Estrutura de Estado (Dicionário de Dados) ---
        let options = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let running = false;
        let winsX = 0;
        let winsO = 0;
        let currentRound = 1;
        
        // Elementos da UI
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('ui-08-status');
        const btnReset = document.getElementById('ui-11-btn-reset');
        const modeSelect = document.getElementById('ui-03-mode');
        const formatSelect = document.getElementById('ui-04-format');
        const scoreXText = document.getElementById('ui-05-score-x');
        const scoreOText = document.getElementById('ui-07-score-o');
        const roundText = document.getElementById('ui-06-round');
        const labelPlayerO = document.getElementById('label-player-o');
        const winLine = document.getElementById('ui-10-win-line');
        const boardElement = document.getElementById('board');

        // Padrões de Vitória
        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Linhas
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Colunas
            [0, 4, 8], [2, 4, 6]             // Diagonais
        ];

        // --- Sintetizador de Áudio (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'X') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'O') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(330, audioCtx.currentTime); // E4
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3); // Sobe para A5
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'draw') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.4); // Desce
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // --- Lógica Principal ---
        function initializeGame() {
            cells.forEach(cell => cell.addEventListener('click', cellClicked));
            btnReset.addEventListener('click', fullReset);
            modeSelect.addEventListener('change', handleConfigChange);
            formatSelect.addEventListener('change', handleConfigChange);
            updateUI();
            running = true;
        }

        function cellClicked(e) {
            const cellIndex = e.target.getAttribute('data-index');

            if (options[cellIndex] !== '' || !running) {
                return;
            }
            
            // Turno do Jogador Humano
            updateCell(e.target, cellIndex);
            checkWinner();

            // Turno da CPU (se aplicável e o jogo ainda estiver rolando)
            if (running && modeSelect.value === 'cpu' && currentPlayer === 'O') {
                running = false; // Bloqueia cliques temporariamente
                statusText.textContent = "Computador pensando...";
                setTimeout(cpuMove, 400); // 400ms de atraso
            }
        }

        function updateCell(cell, index) {
            options[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.style.color = currentPlayer === 'X' ? 'var(--azul-unifor)' : 'var(--laranja-unifor)';
            playSound(currentPlayer);
        }

        function changePlayer() {
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            
            let nomeO = modeSelect.value === 'cpu' ? "Computador" : "Jogador O";
            let nomeAtual = currentPlayer === 'X' ? "Jogador X" : nomeO;
            
            statusText.textContent = `Vez do ${nomeAtual}`;
        }

        function cpuMove() {
            let availableCells = [];
            options.forEach((val, idx) => {
                if (val === '') availableCells.push(idx);
            });

            if (availableCells.length > 0) {
                // Jogada aleatória simples para a CPU
                const randomIdx = Math.floor(Math.random() * availableCells.length);
                const cellIndex = availableCells[randomIdx];
                const cellElement = document.querySelector(`.cell[data-index="${cellIndex}"]`);
                
                updateCell(cellElement, cellIndex);
                running = true; // Libera cliques novamente
                checkWinner();
            }
        }

        function checkWinner() {
            let roundWon = false;
            let winningCondition = [];

            for (let i = 0; i < winPatterns.length; i++) {
                const condition = winPatterns[i];
                const cellA = options[condition[0]];
                const cellB = options[condition[1]];
                const cellC = options[condition[2]];

                if (cellA === '' || cellB === '' || cellC === '') {
                    continue;
                }
                if (cellA === cellB && cellB === cellC) {
                    roundWon = true;
                    winningCondition = condition;
                    break;
                }
            }

            if (roundWon) {
                handleWin(winningCondition);
            } else if (!options.includes('')) {
                handleDraw();
            } else {
                changePlayer();
            }
        }

        function drawWinLine(condition) {
            // Calcula a posição e rotação da linha baseada nos índices vencedores
            const [a, b, c] = condition;
            
            // Tamanho de uma célula (incluindo gap aprox)
            const cellSize = 100; 
            const gap = 5;
            const totalSize = 310; // largura do grid
            
            winLine.style.opacity = '1';
            winLine.style.height = '6px';
            winLine.style.width = '280px'; // Tamanho base
            
            // Define posições baseadas no tipo de vitória
            if (a === 0 && c === 2) { // Linha 1
                winLine.style.top = '16%'; winLine.style.left = '5%'; winLine.style.transform = 'rotate(0deg)';
            } else if (a === 3 && c === 5) { // Linha 2
                winLine.style.top = '50%'; winLine.style.left = '5%'; winLine.style.transform = 'rotate(0deg)';
            } else if (a === 6 && c === 8) { // Linha 3
                winLine.style.top = '84%'; winLine.style.left = '5%'; winLine.style.transform = 'rotate(0deg)';
            } else if (a === 0 && c === 6) { // Col 1
                winLine.style.top = '50%'; winLine.style.left = '-38%'; winLine.style.transform = 'rotate(90deg)';
            } else if (a === 1 && c === 7) { // Col 2
                winLine.style.top = '50%'; winLine.style.left = '5%'; winLine.style.transform = 'rotate(90deg)';
            } else if (a === 2 && c === 8) { // Col 3
                winLine.style.top = '50%'; winLine.style.left = '48%'; winLine.style.transform = 'rotate(90deg)';
            } else if (a === 0 && c === 8) { // Diagonal 1
                winLine.style.width = '380px';
                winLine.style.top = '50%'; winLine.style.left = '-10%'; winLine.style.transform = 'rotate(45deg)';
            } else if (a === 2 && c === 6) { // Diagonal 2
                winLine.style.width = '380px';
                winLine.style.top = '50%'; winLine.style.left = '-10%'; winLine.style.transform = 'rotate(-45deg)';
            }
        }

        function handleWin(condition) {
            running = false; // Bloqueia cliques
            drawWinLine(condition);
            playSound('win');
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

            if (currentPlayer === 'X') {
                winsX++;
                statusText.textContent = "Jogador X Venceu a Rodada!";
            } else {
                winsO++;
                let nome = modeSelect.value === 'cpu' ? "Computador" : "Jogador O";
                statusText.textContent = `${nome} Venceu a Rodada!`;
            }
            
            updateScoreUI();
            checkMatchEnd();
        }

        function handleDraw() {
            running = false;
            playSound('draw');
            statusText.textContent = "Rodada Empatada!";
            
            const format = formatSelect.value;
            if (format === 'bo3' && currentRound < 3 && winsX < 2 && winsO < 2) {
                setTimeout(resetRoundOnly, 2000);
            }
        }

        function checkMatchEnd() {
            const format = formatSelect.value;
            
            if (format === 'bo3') {
                if (winsX >= 2) {
                    statusText.textContent = "🏆 JOGADOR X CAMPEÃO (MD3)!";
                } else if (winsO >= 2) {
                    let nome = modeSelect.value === 'cpu' ? "COMPUTADOR" : "JOGADOR O";
                    statusText.textContent = `🏆 ${nome} CAMPEÃO (MD3)!`;
                } else if (currentRound < 3) {
                    // Avança rodada
                    currentRound++;
                    setTimeout(resetRoundOnly, 2000);
                } else {
                    // Fim da 3a rodada sem 2 vitorias
                    if (winsX > winsO) statusText.textContent = "🏆 JOGADOR X CAMPEÃO (MD3)!";
                    else if (winsO > winsX) {
                        let nome = modeSelect.value === 'cpu' ? "COMPUTADOR" : "JOGADOR O";
                        statusText.textContent = `🏆 ${nome} CAMPEÃO (MD3)!`;
                    }
                    else statusText.textContent = "Partida Empatada!";
                }
            } else {
                // Partida Única, já tratou a vitoria, apenas para
            }
        }

        function resetRoundOnly() {
            options = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            winLine.style.opacity = '0';
            cells.forEach(cell => {
                cell.textContent = '';
            });
            updateUI();
            running = true;
        }

        function fullReset() {
            winsX = 0;
            winsO = 0;
            currentRound = 1;
            resetRoundOnly();
        }

        function handleConfigChange() {
            labelPlayerO.textContent = modeSelect.value === 'cpu' ? "COMPUTADOR" : "JOGADOR O";
            fullReset(); // Ao mudar config, reseta tudo
        }

        function updateUI() {
            scoreXText.textContent = winsX;
            scoreOText.textContent = winsO;
            
            const format = formatSelect.value;
            if (format === 'bo3') {
                roundText.textContent = `${currentRound}/3`;
            } else {
                roundText.textContent = `1/1`;
            }

            statusText.textContent = `Vez do Jogador X`;
        }

        // Inicia o Jogo
        initializeGame();

    </script>
</body>
</html>
